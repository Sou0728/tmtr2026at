<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMTR2026秋 - 描画機能付き</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            box-sizing: border-box;
            padding-top: 8px;
            padding-bottom: 8px;
        }
        /* 横方向の3Dカルーセル用スタイリング */
        .carousel-viewport {
            perspective: 1000px;
        }
        .card-carousel-horizontal {
            display: flex;
            flex-direction: row;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
            height: 100%;
            width: 100%;
        }
        .card-item-horizontal {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform-origin: center center;
            opacity: 0.2;
            transform: scale(0.85);
            flex-shrink: 0;
            padding: 0 1rem;
        }
        .card-item-horizontal.active-card {
            opacity: 1;
            transform: scale(1);
            z-index: 20;
        }
        /* 消しゴムカーソル指示器 */
        .eraser-cursor {
            pointer-events: none;
            position: fixed;
            width: 32px;
            height: 32px;
            box-sizing: border-box;
            border: 2px solid #ef4444;
            background-color: rgba(239, 68, 68, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col bg-slate-50">

    <!-- 初期：名前・ID入力画面モーダル -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-6 md:p-8 flex flex-col items-center border border-slate-100">
            <h2 class="text-xl md:text-2xl font-bold text-slate-800 mb-2">TMTR2026秋</h2>
            <p class="text-xs md:text-sm text-slate-500 mb-6 text-center">参加者情報を入力して解答を始めてください</p>
            
            <div class="w-full flex flex-col gap-4 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">表示名</label>
                    <input type="text" id="input-username" placeholder="TMTR運営" class="w-full px-5 py-3 rounded-full border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ユーザーID</label>
                    <input type="text" id="input-userid" placeholder="TMTR_nazo" class="w-full px-5 py-3 rounded-full border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/50">
                </div>
            </div>

            <button id="start-gallery-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-full shadow-md transition-all active:scale-[0.98] text-sm">
                解答を開始する
            </button>
        </div>
    </div>

    <!-- 提出前 最終確認ダイアログ（モーダル） -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-6 flex flex-col max-h-[90vh] border border-slate-100">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-3">
                <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-clipboard-check text-indigo-600"></i>
                    解答内容の最終確認
                </h3>
                <span id="confirm-remaining-count" class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full border border-indigo-100">
                    残り提出可能回数: - 回
                </span>
            </div>

            <p class="text-xs text-slate-500 mb-3">以下の内容で提出します。よろしいですか？</p>

            <!-- 解答一覧表示エリア -->
            <div id="confirm-answers-list" class="flex-1 overflow-y-auto space-y-2 pr-1 mb-4 text-xs"></div>

            <div class="flex items-center justify-end gap-3 border-t border-slate-100 pt-3">
                <button id="cancel-submit-btn" class="px-5 py-2.5 rounded-full border border-slate-200 text-slate-600 hover:bg-slate-50 font-bold text-xs transition-colors">
                    修正に戻る
                </button>
                <button id="final-submit-btn" class="px-6 py-2.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md active:scale-95 transition-all flex items-center gap-1.5">
                    <span>確定して提出</span>
                    <i class="fa-solid fa-paper-plane text-[10px]"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="w-full bg-white border-b border-slate-100 px-3 py-2 flex items-center justify-between shrink-0 shadow-sm z-40 gap-2 relative">
        <div class="flex items-center gap-2">
            <button id="view-toggle-btn" class="bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold py-1.5 px-3 rounded-full flex items-center gap-1.5 transition-colors border border-slate-200 shadow-sm">
                <i id="toggle-icon" class="fa-solid fa-border-all"></i>
                <span id="toggle-text" class="hidden sm:inline">一覧表示</span>
            </button>
            <span id="header-user-info" class="text-xs font-semibold text-slate-700 hidden md:inline"></span>
        </div>
        
        <!-- 中央: 描画モード切替＆描画ツールバー (一覧表示時は非表示) -->
        <div id="draw-mode-container" class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-full border border-slate-200 shadow-inner">
            <!-- 描画モード スイッチ（アイコンのみ） -->
            <button id="draw-mode-toggle-btn" class="w-8 h-8 rounded-full text-xs font-bold flex items-center justify-center transition-all bg-white text-slate-600 shadow-sm" title="描画モード: OFF">
                <i class="fa-solid fa-pen-nib"></i>
            </button>

            <!-- 描画ツール群 (描画ON時のみ有効化表示) -->
            <div id="drawing-tools" class="flex items-center gap-1 pl-1 border-l border-slate-300 opacity-40 pointer-events-none transition-opacity">
                <!-- ペン色選択 -->
                <button class="color-btn w-6 h-6 rounded-full bg-red-500 border-2 border-white shadow-sm transition-transform ring-2 ring-indigo-500 scale-110" data-color="#ef4444" title="赤ペン"></button>
                <button class="color-btn w-6 h-6 rounded-full bg-blue-500 border-2 border-white shadow-sm transition-transform" data-color="#3b82f6" title="青ペン"></button>
                <button class="color-btn w-6 h-6 rounded-full bg-slate-900 border-2 border-white shadow-sm transition-transform" data-color="#1e293b" title="黒ペン"></button>
                
                <!-- 消しゴム -->
                <button id="eraser-btn" class="w-6 h-6 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center text-xs transition-transform" title="消しゴム">
                    <i class="fa-solid fa-eraser"></i>
                </button>
                <!-- ひとつ戻る -->
                <button id="undo-drawing-btn" class="w-6 h-6 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center text-xs transition-transform" title="ひとつ戻る">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>

                <div class="h-4 w-px bg-slate-300 mx-0.5"></div>

                <!-- 表示 / 非表示 切替 -->
                <button id="visibility-toggle-btn" class="w-6 h-6 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center text-xs" title="描画を表示/非表示">
                    <i id="visibility-icon" class="fa-solid fa-eye"></i>
                </button>

                <!-- 全消去 -->
                <button id="clear-canvas-btn" class="w-6 h-6 rounded-full bg-rose-100 hover:bg-rose-200 text-rose-600 flex items-center justify-center text-xs" title="現在の描画を全消去">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
        </div>

        <!-- 30分タイマー & 提出 -->
        <div class="flex items-center gap-2">
            <div id="timer-container" class="flex items-center gap-1 bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-full text-amber-700 font-bold text-xs shadow-inner">
                <i class="fa-regular fa-clock"></i>
                <span id="countdown-timer">30:00</span>
            </div>

            <button id="submit-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-1.5 px-3 rounded-full text-xs shadow-md transition-all active:scale-95 flex items-center gap-1 shrink-0">
                <span>提出</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
        </div>
    </header>

    <!-- メインビューポート -->
    <main class="flex-1 relative flex flex-col items-center justify-center overflow-hidden p-2">
        <!-- インジケータードット -->
        <div id="indicators" class="flex items-center gap-1.5 mb-1 shrink-0 z-30"></div>

        <!-- スライダー / グリッドコンテナ -->
        <div id="viewport-container" class="carousel-viewport w-full max-w-3xl flex-1 relative overflow-hidden rounded-2xl flex items-center justify-center">
            
            <!-- 横型3Dカルーセルスライダー -->
            <div id="cards-wrapper" class="card-carousel-horizontal absolute inset-0 items-center justify-start"></div>

            <!-- グリッド一覧表示ビュー（初期非表示） -->
            <div id="grid-wrapper" class="absolute inset-0 bg-slate-50/95 backdrop-blur-md p-4 overflow-y-auto hidden z-30 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
        </div>

        <!-- 解答入力セクション -->
        <div id="answer-section" class="w-full max-w-md mt-1 mb-1 flex items-center justify-center shrink-0 z-30 px-2">
            <input type="text" id="answer-input" class="w-full bg-white border border-slate-200 rounded-full px-5 py-2 text-xs md:text-sm text-center shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:text-slate-400" placeholder="○問題の解答を入力">
        </div>
    </main>

    <!-- 消しゴム表示用サークル -->
    <div id="eraser-cursor" class="eraser-cursor"></div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs md:text-sm px-4 py-2.5 rounded-full shadow-lg pointer-events-none transition-opacity duration-300 opacity-0 z-50 text-center max-w-xs"></div>

    <script>
        const puzzleData = [
            { id: 'A', title: '問題 A', src: 'image_2.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+A' },
            { id: 'B', title: '問題 B', src: 'image_3.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+B' },
            { id: 'C', title: '問題 C', src: 'image_4.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+C' },
            { id: 'D', title: '問題 D', src: 'image_5.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+D' },
            { id: 'E', title: '問題 E', src: 'image_6.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+E' },
            { id: 'F', title: '問題 F', src: 'image_7.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+F' },
            { id: 'G', title: '問題 G', src: 'image_8.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+G' },
            { id: 'H', title: '問題 H', src: 'image_9.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+H' },
            { id: 'I', title: '問題 I', src: 'image_10.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+I' },
            { id: 'J', title: '問題 J', src: 'image_11.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+J' }
        ];

        let currentIndex = 0;
        let isGridView = false;
        let countdownSeconds = 30 * 60;
        let isTimeUp = false;
        let currentUser = { name: '', id: '' };

        const savedAnswers = {};
        const transformStates = {};

        // 描画関連の状態変数
        let isDrawMode = false; // 全問題共通の描画モードスイッチ（初期値OFF）
        let currentTool = 'pen'; // 'pen' | 'eraser'
        let currentColor = '#ef4444'; // 初期ペン色: 赤
        const ERASER_SIZE = 32; // ピクセル消しゴムの直径 (px)
        const canvasContexts = {}; // 問題IDごとのキャンバスコンテキスト
        const drawingHistory = {}; // 問題IDごとのUndo履歴
        const MAX_UNDO_STEPS = 30;
        const drawingStore = {};   // 問題IDごとの描画状態 { visible: true } （実際の描画はHTML5 Canvasのピクセルデータとして保持）

        puzzleData.forEach(data => {
            savedAnswers[data.id] = '';
            transformStates[data.id] = { scale: 1, panX: 0, panY: 0 };
            drawingStore[data.id] = { visible: true };
            drawingHistory[data.id] = [];
        });

        let submissionCount = 0;
        const MAX_SUBMISSIONS = 2;
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/u/2/s/AKfycbyi6J6XeaJYv7D_H-0Lgv6q3J_1WxtJfeJWdFAlS9WVH_QbtWod6XZFPUws0gXljDdntQ/exec';

        const zoomResetHandlers = {};

        const loginModal = document.getElementById('login-modal');
        const confirmModal = document.getElementById('confirm-modal');
        const confirmAnswersList = document.getElementById('confirm-answers-list');
        const confirmRemainingCount = document.getElementById('confirm-remaining-count');
        const cancelSubmitBtn = document.getElementById('cancel-submit-btn');
        const finalSubmitBtn = document.getElementById('final-submit-btn');

        const startGalleryBtn = document.getElementById('start-gallery-btn');
        const inputUsername = document.getElementById('input-username');
        const inputUserid = document.getElementById('input-userid');
        const headerUserInfo = document.getElementById('header-user-info');
        const cardsWrapper = document.getElementById('cards-wrapper');
        const gridWrapper = document.getElementById('grid-wrapper');
        const indicators = document.getElementById('indicators');
        const viewToggleBtn = document.getElementById('view-toggle-btn');
        const toggleIcon = document.getElementById('toggle-icon');
        const toggleText = document.getElementById('toggle-text');
        const answerInput = document.getElementById('answer-input');
        const answerSection = document.getElementById('answer-section');
        const submitBtn = document.getElementById('submit-btn');
        const toast = document.getElementById('toast');

        // 描画コントロール用エレメント
        const drawModeToggleBtn = document.getElementById('draw-mode-toggle-btn');
        const drawingTools = document.getElementById('drawing-tools');
        const colorBtns = document.querySelectorAll('.color-btn');
        const eraserBtn = document.getElementById('eraser-btn');
        const undoDrawingBtn = document.getElementById('undo-drawing-btn');
        const timerContainer = document.getElementById('timer-container');
        const visibilityToggleBtn = document.getElementById('visibility-toggle-btn');
        const visibilityIcon = document.getElementById('visibility-icon');
        const clearCanvasBtn = document.getElementById('clear-canvas-btn');
        const eraserCursor = document.getElementById('eraser-cursor');

        function startCountdown() {
            const timerEl = document.getElementById('countdown-timer');
            const timerInterval = setInterval(() => {
                if (countdownSeconds > 0) {
                    countdownSeconds--;
                    const minutes = Math.floor(countdownSeconds / 60);
                    const seconds = countdownSeconds % 60;
                    timerEl.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                } else {
                    clearInterval(timerInterval);
                    isTimeUp = true;
                    timerEl.innerText = '00:00';
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    showToast('制限時間が経過したため、提出受付を終了しました。');
                }
            }, 1000);
        }

        function showToast(msg) {
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        startGalleryBtn.addEventListener('click', () => {
            const name = inputUsername.value.trim();
            const id = inputUserid.value.trim();
            if (!name || !id) {
                showToast('表示名とユーザーIDを入力してください。');
                return;
            }
            currentUser = { name, id };
            headerUserInfo.innerHTML = `<i class="fa-solid fa-user mr-1 text-indigo-500"></i>${currentUser.name} <span class="text-slate-400 font-normal">(${currentUser.id})</span>`;
            loginModal.classList.add('hidden');
            startCountdown();
        });

        // カルーセル用カード生成 (横スクロール対応)
        puzzleData.forEach((data, idx) => {
            const dot = document.createElement('div');
            dot.className = `w-2 h-2 rounded-full transition-all cursor-pointer ${idx === 0 ? 'bg-indigo-600 w-4' : 'bg-slate-300'}`;
            dot.addEventListener('click', () => {
                if (isGridView) toggleView();
                currentIndex = idx;
                updateCarousel();
            });
            indicators.appendChild(dot);

            const card = document.createElement('div');
            card.className = `card-item-horizontal ${idx === 0 ? 'active-card' : ''}`;
            card.dataset.index = idx;
            card.innerHTML = `
                <div class="w-full max-w-2xl flex items-center justify-between mb-1 px-1 shrink-0 z-30">
                    <span class="text-xs text-slate-500 font-bold">${data.title}</span>
                </div>
                <div class="w-full max-w-2xl flex-1 rounded-2xl bg-white flex flex-col justify-between items-center border border-slate-100 p-2 overflow-hidden relative shadow-sm" id="card-inner-${data.id}">
                    <button type="button" id="reset-zoom-${data.id}" class="absolute top-3 right-3 bg-slate-900/70 hover:bg-slate-900 text-white text-[10px] px-2.5 py-1 rounded-full shadow-md z-30 hidden transition-all" onclick="window.resetZoomInstance('${data.id}')">元に戻す</button>
                    <div class="w-full h-full relative flex items-center justify-center overflow-hidden image-wrapper-box" id="img-wrapper-${data.id}">
                        <div id="transform-target-${data.id}" class="relative max-w-full max-h-full flex items-center justify-center transition-transform duration-75 origin-center">
                            <img src="${data.src}" onerror="this.src='${data.fallback}'" class="max-w-full max-h-full object-contain select-none pointer-events-none" id="img-${data.id}" alt="${data.title}">
                            <canvas id="canvas-${data.id}" class="absolute inset-0 w-full h-full pointer-events-auto" style="touch-action: none;"></canvas>
                        </div>
                    </div>
                </div>
            `;
            cardsWrapper.appendChild(card);
            setupZoomAndPan(data.id);
            setupDrawingCanvas(data.id);
        });

        // グリッドビューカード生成
        puzzleData.forEach((data, idx) => {
            const gridCard = document.createElement('div');
            gridCard.className = 'bg-white border border-slate-200 rounded-2xl p-3 flex flex-col items-center justify-between shadow-sm cursor-pointer hover:border-indigo-300 transition-all';
            gridCard.onclick = () => {
                currentIndex = idx;
                toggleView();
            };
            
            const hasAnswer = savedAnswers[data.id] && savedAnswers[data.id].trim() !== '';
            const statusBadgeClass = hasAnswer 
                ? 'text-indigo-600 bg-indigo-50 border-indigo-100 font-semibold' 
                : 'text-slate-400 bg-slate-100 border-slate-200';
            const statusText = hasAnswer ? savedAnswers[data.id] : '未解答';

            gridCard.innerHTML = `
                <div class="w-full flex items-center justify-between mb-1">
                    <span class="text-xs font-bold text-slate-700">${data.title}</span>
                </div>
                <div class="w-full aspect-[4/3] bg-slate-50 rounded-xl overflow-hidden flex items-center justify-center border border-slate-100 mb-2">
                    <img src="${data.src}" onerror="this.src='${data.fallback}'" class="max-w-full max-h-full object-contain">
                </div>
                <div class="w-full text-center">
                    <span id="grid-status-${data.id}" class="inline-block text-[10px] px-2.5 py-0.5 rounded-full border ${statusBadgeClass} truncate max-w-full">
                        ${statusText}
                    </span>
                </div>
            `;
            gridWrapper.appendChild(gridCard);
        });

        // 描画状態をUndo履歴へ保存（1ストローク／1回の消しゴム操作を1単位とする）
        function saveDrawingState(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const snapshot = document.createElement('canvas');
            snapshot.width = canvas.width;
            snapshot.height = canvas.height;
            snapshot.getContext('2d').drawImage(canvas, 0, 0);
            const history = drawingHistory[id] || (drawingHistory[id] = []);
            history.push(snapshot);
            if (history.length > MAX_UNDO_STEPS) history.shift();
        }

        function undoDrawing() {
            const currentId = puzzleData[currentIndex].id;
            const canvas = document.getElementById(`canvas-${currentId}`);
            const history = drawingHistory[currentId];
            if (!canvas || !history || history.length === 0) {
                showToast('これ以上戻せる操作はありません');
                return;
            }
            const previous = history.pop();
            const ctx = canvasContexts[currentId];
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (previous.width > 0 && previous.height > 0) {
                ctx.drawImage(previous, 0, 0, previous.width, previous.height,
                    0, 0, canvas.width, canvas.height);
            }
            ctx.restore();
            showToast('ひとつ前の描画に戻しました');
        }

        // キャンバスおよびピクセル消しゴムのセットアップ
        function setupDrawingCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const ctx = canvas.getContext('2d');
            canvasContexts[id] = ctx;

            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;

            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                if (rect.width > 0 && rect.height > 0) {
                    if (canvas.width !== Math.floor(rect.width) || canvas.height !== Math.floor(rect.height)) {
                        // 既存の描画ピクセルを保持しながらサイズ変更
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = canvas.width;
                        tempCanvas.height = canvas.height;
                        const tempCtx = tempCanvas.getContext('2d');
                        if (canvas.width > 0 && canvas.height > 0) {
                            tempCtx.drawImage(canvas, 0, 0);
                        }

                        canvas.width = rect.width;
                        canvas.height = rect.height;

                        if (tempCanvas.width > 0 && tempCanvas.height > 0) {
                            ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, canvas.width, canvas.height);
                        }
                    }
                }
            }
            window.addEventListener('resize', resizeCanvas);
            setTimeout(resizeCanvas, 100);

            // 拡大時にもペンの太さが変わらないよう、キャンバス上のローカル座標へ正確に変換
            function getCanvasCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

                // CSS表示上のオフセットを現在のスケールで割ってキャンバス内部ピクセル座標に合わせる
                const x = (clientX - rect.left) * (canvas.width / rect.width);
                const y = (clientY - rect.top) * (canvas.height / rect.height);
                return { x, y };
            }

            canvas.addEventListener('pointerdown', (e) => {
                if (!isDrawMode) return;
                saveDrawingState(id);
                isDrawing = true;
                try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
                const coords = getCanvasCoordinates(e);
                lastX = coords.x;
                lastY = coords.y;

                if (currentTool === 'eraser') {
                    eraserCursor.style.display = 'block';
                    eraserCursor.style.left = `${e.clientX}px`;
                    eraserCursor.style.top = `${e.clientY}px`;
                    erasePixels(ctx, lastX, lastY);
                }
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!isDrawMode) return;
                if (currentTool === 'eraser') {
                    eraserCursor.style.left = `${e.clientX}px`;
                    eraserCursor.style.top = `${e.clientY}px`;
                }

                if (!isDrawing) return;
                const coords = getCanvasCoordinates(e);

                if (currentTool === 'pen') {
                    ctx.save();
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = 3; // 常に一定の太さ
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();
                    ctx.restore();
                } else if (currentTool === 'eraser') {
                    erasePixels(ctx, coords.x, coords.y);
                }

                lastX = coords.x;
                lastY = coords.y;
            });

            const stopDrawing = () => {
                if (!isDrawing) return;
                isDrawing = false;
                eraserCursor.style.display = 'none';
            };

            canvas.addEventListener('pointerup', stopDrawing);
            canvas.addEventListener('pointerleave', () => {
                stopDrawing();
                eraserCursor.style.display = 'none';
            });
        }

        function erasePixels(ctx, x, y) {
            ctx.save();
            ctx.beginPath();
            // ピクセル単位で綺麗に削るため destination-out を利用
            ctx.globalCompositeOperation = 'destination-out';
            ctx.arc(x, y, ERASER_SIZE / 2, 0, Math.PI * 2, false);
            ctx.fill();
            ctx.restore();
        }

        function updateVisibilityUI() {
            const currentId = puzzleData[currentIndex].id;
            const isVisible = drawingStore[currentId].visible;
            const canvas = document.getElementById(`canvas-${currentId}`);
            if (canvas) {
                canvas.style.display = isVisible ? 'block' : 'none';
            }
            if (isVisible) {
                visibilityIcon.className = 'fa-solid fa-eye';
                visibilityToggleBtn.title = '描画を表示中（クリックで非表示）';
            } else {
                visibilityIcon.className = 'fa-solid fa-eye-slash text-rose-500';
                visibilityToggleBtn.title = '描画を非表示中（クリックで表示）';
            }
        }

        // 描画モード切替（アイコンのみ・全問題で変更が反映される）
        drawModeToggleBtn.addEventListener('click', () => {
            isDrawMode = !isDrawMode;
            if (isDrawMode) {
                drawModeToggleBtn.className = 'w-8 h-8 rounded-full text-xs font-bold flex items-center justify-center transition-all bg-indigo-600 text-white shadow-sm';
                drawModeToggleBtn.title = '描画モード: ON';
                drawingTools.classList.remove('opacity-40', 'pointer-events-none');
            } else {
                drawModeToggleBtn.className = 'w-8 h-8 rounded-full text-xs font-bold flex items-center justify-center transition-all bg-white text-slate-600 shadow-sm';
                drawModeToggleBtn.title = '描画モード: OFF';
                drawingTools.classList.add('opacity-40', 'pointer-events-none');
                eraserCursor.style.display = 'none';
            }
        });

        // ペン色選択
        colorBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                currentTool = 'pen';
                currentColor = btn.dataset.color;
                colorBtns.forEach(b => b.classList.remove('ring-2', 'ring-indigo-500', 'scale-110'));
                btn.classList.add('ring-2', 'ring-indigo-500', 'scale-110');
                eraserBtn.classList.remove('ring-2', 'ring-indigo-500', 'bg-indigo-100');
            });
        });

        // 消しゴム選択
        eraserBtn.addEventListener('click', () => {
            currentTool = 'eraser';
            colorBtns.forEach(b => b.classList.remove('ring-2', 'ring-indigo-500', 'scale-110'));
            eraserBtn.classList.add('ring-2', 'ring-indigo-500', 'bg-indigo-100');
        });

        // ひとつ戻る
        undoDrawingBtn.addEventListener('click', undoDrawing);

        // 表示/非表示切替
        visibilityToggleBtn.addEventListener('click', () => {
            const currentId = puzzleData[currentIndex].id;
            drawingStore[currentId].visible = !drawingStore[currentId].visible;
            updateVisibilityUI();
        });

        // 全消去：現在表示中の問題のキャンバスを即時クリアする
        clearCanvasBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            const currentId = puzzleData[currentIndex].id;
            const canvas = document.getElementById(`canvas-${currentId}`);
            const ctx = canvasContexts[currentId];

            if (!canvas || !ctx) {
                showToast('描画キャンバスが見つかりませんでした');
                return;
            }

            // 全消去もUndoできるよう、消去前の状態を保存する
            saveDrawingState(currentId);

            // キャンバス全体を消去し、消去前の合成モード等も初期化する
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.restore();

            showToast('現在の問題の描画をすべて消去しました');
        });

        function updateCarousel() {
            const cardWidth = cardsWrapper.clientWidth || 600;
            cardsWrapper.style.transform = `translateX(-${currentIndex * cardWidth}px)`;

            const cards = cardsWrapper.querySelectorAll('.card-item-horizontal');
            cards.forEach((card, idx) => {
                if (idx === currentIndex) {
                    card.classList.add('active-card');
                } else {
                    card.classList.remove('active-card');
                }
            });

            const dots = indicators.querySelectorAll('div');
            dots.forEach((dot, idx) => {
                if (idx === currentIndex) {
                    dot.className = 'w-4 h-2 rounded-full bg-indigo-600 transition-all cursor-pointer';
                } else {
                    dot.className = 'w-2 h-2 rounded-full bg-slate-300 transition-all cursor-pointer';
                }
            });

            const currentId = puzzleData[currentIndex].id;
            answerInput.value = savedAnswers[currentId] || '';
            answerInput.placeholder = `${currentId}問題の解答を入力`;

            setTimeout(() => {
                updateVisibilityUI();
            }, 50);
        }

        viewToggleBtn.addEventListener('click', toggleView);

        function toggleView() {
            isGridView = !isGridView;

            const drawModeContainer = document.getElementById('draw-mode-container');

            if (isGridView) {
                gridWrapper.classList.remove('hidden');
                cardsWrapper.classList.add('hidden');
                indicators.classList.add('hidden');
                answerSection.classList.add('hidden');
                drawModeContainer.classList.add('hidden'); // 一覧表示時は描画ツールを非表示
                timerContainer.classList.add('absolute', 'left-1/2', '-translate-x-1/2');
                toggleIcon.className = 'fa-solid fa-clone';
                toggleText.innerText = '個別表示';
            } else {
                gridWrapper.classList.add('hidden');
                cardsWrapper.classList.remove('hidden');
                indicators.classList.remove('hidden');
                answerSection.classList.remove('hidden');
                drawModeContainer.classList.remove('hidden'); // 個別表示時に再表示
                timerContainer.classList.remove('absolute', 'left-1/2', '-translate-x-1/2');
                toggleIcon.className = 'fa-solid fa-border-all';
                toggleText.innerText = '一覧表示';
                updateCarousel();
            }
        }

        function setupZoomAndPan(id) {
            const wrapper = document.getElementById(`img-wrapper-${id}`);
            const transformTarget = document.getElementById(`transform-target-${id}`);
            const resetBtn = document.getElementById(`reset-zoom-${id}`);

            let isPanning = false;
            let startPanX = 0;
            let startPanY = 0;

            function updateTransform() {
                const state = transformStates[id];
                // パン操作中の遅延補間を無効化し、ポインター位置へ即時追従させる
                transformTarget.style.transition = 'none';
                
                const maxPanX = Math.max(0, (wrapper.clientWidth * (state.scale - 1)) / 2);
                const maxPanY = Math.max(0, (wrapper.clientHeight * (state.scale - 1)) / 2);
                
                if (state.panX > maxPanX) state.panX = maxPanX;
                if (state.panX < -maxPanX) state.panX = -maxPanX;
                if (state.panY > maxPanY) state.panY = maxPanY;
                if (state.panY < -maxPanY) state.panY = -maxPanY;

                transformTarget.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
                
                if (state.scale > 1.02) {
                    resetBtn.classList.remove('hidden');
                } else {
                    resetBtn.classList.add('hidden');
                }
            }

            zoomResetHandlers[id] = function() {
                transformStates[id] = { scale: 1, panX: 0, panY: 0 };
                updateTransform();
            };

            wrapper.addEventListener('pointerdown', (e) => {
                if (isDrawMode) return; // 描画モード時は移動無効
                const state = transformStates[id];
                if (state.scale > 1.02) {
                    isPanning = true;
                    try { wrapper.setPointerCapture(e.pointerId); } catch (_) {}
                    startPanX = e.clientX - state.panX;
                    startPanY = e.clientY - state.panY;
                }
            });

            wrapper.addEventListener('pointermove', (e) => {
                if (isDrawMode) return;
                const state = transformStates[id];
                if (isPanning && state.scale > 1.02) {
                    state.panX = e.clientX - startPanX;
                    state.panY = e.clientY - startPanY;
                    updateTransform();
                }
            });

            wrapper.addEventListener('pointerup', () => { isPanning = false; });
            wrapper.addEventListener('pointercancel', () => { isPanning = false; });
            wrapper.addEventListener('lostpointercapture', () => { isPanning = false; });

            wrapper.addEventListener('wheel', (e) => {
                if (isDrawMode) return; // 描画モード時はズーム無効
                e.preventDefault();
                const state = transformStates[id];
                const zoomFactor = 1.15;
                if (e.deltaY < 0) {
                    state.scale = Math.min(state.scale * zoomFactor, 4.0);
                } else {
                    state.scale = Math.max(state.scale / zoomFactor, 1.0);
                    if (state.scale <= 1.0) {
                        state.panX = 0;
                        state.panY = 0;
                    }
                }
                updateTransform();
            }, { passive: false });

            let initialPinchDistance = null;
            wrapper.addEventListener('touchstart', (e) => {
                if (isDrawMode) return;
                if (e.touches.length === 2) {
                    initialPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            }, { passive: true });

            wrapper.addEventListener('touchmove', (e) => {
                if (isDrawMode) return;
                if (e.touches.length === 2 && initialPinchDistance !== null) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const state = transformStates[id];
                    const factor = dist / initialPinchDistance;
                    state.scale = Math.min(Math.max(state.scale * (factor > 1 ? 1.05 : 0.95), 1.0), 4.0);
                    if (state.scale <= 1.0) {
                        state.panX = 0;
                        state.panY = 0;
                    }
                    initialPinchDistance = dist;
                    updateTransform();
                }
            }, { passive: true });

            wrapper.addEventListener('touchend', () => {
                initialPinchDistance = null;
            }, { passive: true });
        }

        window.resetZoomInstance = function(id) {
            if (zoomResetHandlers[id]) {
                zoomResetHandlers[id]();
            }
        };

        answerInput.addEventListener('input', (e) => {
            const currentId = puzzleData[currentIndex].id;
            const val = e.target.value;
            savedAnswers[currentId] = val;

            const gridBadge = document.getElementById(`grid-status-${currentId}`);
            if (gridBadge) {
                if (val && val.trim() !== '') {
                    gridBadge.className = 'inline-block text-[10px] px-2.5 py-0.5 rounded-full border text-indigo-600 bg-indigo-50 border-indigo-100 font-semibold truncate max-w-full';
                    gridBadge.innerText = val;
                } else {
                    gridBadge.className = 'inline-block text-[10px] px-2.5 py-0.5 rounded-full border text-slate-400 bg-slate-100 border-slate-200 truncate max-w-full';
                    gridBadge.innerText = '未解答';
                }
            }
        });

        // 横スワイプ問題切替（描画モードOFF時のみ動作）
        let touchStartX = 0;
        let touchEndX = 0;

        cardsWrapper.addEventListener('touchstart', (e) => {
            if (isDrawMode) return; // 描画モードON時は他問題へのスクロール禁止

            const currentId = puzzleData[currentIndex].id;
            const currentScale = transformStates[currentId]?.scale || 1;

            if (currentScale <= 1.05 && e.touches.length === 1) {
                touchStartX = e.changedTouches[0].clientX;
            } else {
                touchStartX = 0;
            }
        }, { passive: true });

        cardsWrapper.addEventListener('touchend', (e) => {
            if (isDrawMode) return; // 描画モードON時は他問題へのスクロール禁止

            const currentId = puzzleData[currentIndex].id;
            const currentScale = transformStates[currentId]?.scale || 1;

            if (currentScale <= 1.05 && touchStartX !== 0 && e.changedTouches.length === 1) {
                touchEndX = e.changedTouches[0].clientX;
                if (touchEndX < touchStartX - 40) {
                    if (currentIndex < puzzleData.length - 1) {
                        currentIndex++;
                    } else {
                        currentIndex = 0;
                    }
                    updateCarousel();
                }
                if (touchEndX > touchStartX + 40) {
                    if (currentIndex > 0) {
                        currentIndex--;
                    } else {
                        currentIndex = puzzleData.length - 1;
                    }
                    updateCarousel();
                }
            }
        }, { passive: true });

        submitBtn.addEventListener('click', () => {
            if (isTimeUp) {
                showToast('制限時間が終了しているため提出できません。');
                return;
            }

            if (submissionCount >= MAX_SUBMISSIONS) {
                showToast(`提出回数の上限（${MAX_SUBMISSIONS}回）に達しました。`);
                return;
            }

            const remaining = MAX_SUBMISSIONS - submissionCount;
            confirmRemainingCount.innerText = `残り提出可能回数: ${remaining} 回`;

            confirmAnswersList.innerHTML = '';
            puzzleData.forEach(p => {
                const ans = savedAnswers[p.id].trim();
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between bg-slate-50 border border-slate-100 p-2.5 rounded-xl';
                item.innerHTML = `
                    <span class="font-bold text-slate-700">${p.title}</span>
                    <span class="font-semibold ${ans ? 'text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100' : 'text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full'}">
                        ${ans || '未回答'}
                    </span>
                `;
                confirmAnswersList.appendChild(item);
            });

            confirmModal.classList.remove('hidden');
        });

        cancelSubmitBtn.addEventListener('click', () => {
            confirmModal.classList.add('hidden');
        });

        finalSubmitBtn.addEventListener('click', async () => {
            confirmModal.classList.add('hidden');
            submissionCount++;

            const submissionData = {
                timestamp: new Date().toLocaleString('ja-JP'),
                name: currentUser.name,
                id: currentUser.id,
                submissionCount: submissionCount,
                answers: { ...savedAnswers }
            };

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');
            showToast(`(${submissionCount}/${MAX_SUBMISSIONS}) データを送信中...`);

            try {
                if (GAS_WEB_APP_URL && GAS_WEB_APP_URL !== 'https://script.google.com/macros/u/2/s/AKfycbyi6J6XeaJYv7D_H-0Lgv6q3J_1WxtJfeJWdFAlS9WVH_QbtWod6XZFPUws0gXljDdntQ/exec](https://script.google.com/macros/u/2/s/AKfycbyi6J6XeaJYv7D_H-0Lgv6q3J_1WxtJfeJWdFAlS9WVH_QbtWod6XZFPUws0gXljDdntQ/exec') {
                    await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(submissionData)
                    });
                } else {
                    console.log('提出データ:', submissionData);
                }

                showToast(`${currentUser.name} さん (${submissionCount}回目) の解答を提出しました！`);
            } catch (err) {
                console.error(err);
                showToast('送信に失敗しました。');
            } finally {
                if (submissionCount < MAX_SUBMISSIONS && !isTimeUp) {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-50');
                } else {
                    submitBtn.innerText = '提出終了';
                }
            }
        });

        updateCarousel();
    </script>
</body>
</html>
