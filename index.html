<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMTR2026秋</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            box-sizing: border-box;
            padding-top: 4px;
            padding-bottom: 4px;
        }
        /* 横方向の3Dカルーセル用スタイリング */
        .carousel-viewport {
            perspective: 1000px;
        }
        .card-carousel-horizontal {
            display: flex;
            flex-direction: row;
            align-items: center;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
            height: 100%;
            width: 100%;
        }
        .card-item-horizontal {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform-origin: center center;
            opacity: 0.2;
            transform: scale(0.85);
            flex-shrink: 0;
            padding: 0 1rem;
        }
        .card-item-horizontal.active-card {
            opacity: 1;
            transform: scale(1);
            z-index: 20;
        }
        .toolbar-control {
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            flex-shrink: 0;
        }
        .toolbar-scroll {
            overscroll-behavior-x: contain;
            -webkit-overflow-scrolling: touch;
        }
        /* 消しゴムカーソル指示器 */
        .eraser-cursor {
            pointer-events: none;
            position: fixed;
            box-sizing: border-box;
            border: 2px solid #ef4444;
            background-color: rgba(239, 68, 68, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col bg-slate-50">

    <!-- 初期：名前・ID入力画面モーダル -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-6 md:p-8 flex flex-col items-center border border-slate-100">
            <h2 class="text-xl md:text-2xl font-bold text-slate-800 mb-2">TMTR2026秋</h2>
            <p class="text-xs md:text-sm text-slate-500 mb-6 text-center">参加者情報を入力して解答を始めてください</p>
            
            <div class="w-full flex flex-col gap-4 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">表示名</label>
                    <input type="text" id="input-username" placeholder="TMTR運営" class="w-full px-5 py-3 rounded-full border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ユーザーID</label>
                    <input type="text" id="input-userid" placeholder="TMTR_nazo" class="w-full px-5 py-3 rounded-full border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/50">
                </div>
            </div>

            <button id="start-gallery-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-full shadow-md transition-all active:scale-[0.98] text-sm">
                解答を開始する
            </button>
        </div>
    </div>

    <!-- 提出前 最終確認ダイアログ（モーダル） -->
    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-6 flex flex-col max-h-[90vh] border border-slate-100">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-3">
                <h3 id="confirm-title" class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-clipboard-check text-indigo-600"></i>
                    解答内容の最終確認
                </h3>
                <span id="confirm-remaining-count" class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full border border-indigo-100">
                    残り提出可能回数: - 回
                </span>
            </div>

            <p id="confirm-description" class="text-xs text-slate-500 mb-3">以下の内容で提出します。よろしいですか？</p>

            <!-- 解答一覧表示エリア -->
            <div id="confirm-answers-list" class="flex-1 overflow-y-auto space-y-2 pr-1 mb-4 text-xs"></div>

            <div class="flex items-center justify-end gap-3 border-t border-slate-100 pt-3">
                <button id="cancel-submit-btn" class="px-5 py-2.5 rounded-full border border-slate-200 text-slate-600 hover:bg-slate-50 font-bold text-xs transition-colors">
                    修正に戻る
                </button>
                <button id="final-submit-btn" class="px-6 py-2.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md active:scale-95 transition-all flex items-center gap-1.5">
                    <span>確定して提出</span>
                    <i class="fa-solid fa-paper-plane text-[10px]"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ヘッダー -->
    <header class="w-full min-h-[56px] bg-white border-b border-slate-100 px-3 py-1.5 grid grid-cols-[auto_minmax(0,1fr)_auto] grid-rows-1 items-center shrink-0 shadow-sm z-40 gap-x-2 gap-y-1 relative max-w-6xl mx-auto rounded-b-2xl box-border">
        <div class="flex items-center gap-2">
            <button id="view-toggle-btn" class="bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold py-1.5 px-3 rounded-full flex items-center gap-1.5 transition-colors border border-slate-200 shadow-sm">
                <i id="toggle-icon" class="fa-solid fa-border-all"></i>
                <span id="toggle-text" class="hidden sm:inline">一覧表示</span>
            </button>
            <span id="header-user-info" class="text-xs font-semibold text-slate-700 hidden md:inline"></span>
        </div>
        
        <!-- 中央: 描画モード切替＆描画ツールバー -->
        <div id="draw-mode-container" class="justify-self-center min-w-0 w-full max-w-full flex items-center justify-center gap-1.5 bg-slate-100 px-2 py-1 rounded-full border border-slate-200 shadow-inner">
            <!-- 描画モード スイッチ -->
            <button id="draw-mode-toggle-btn" class="w-9 h-9 rounded-full text-xs font-bold flex items-center justify-center transition-all bg-white text-slate-600 shadow-sm shrink-0" title="描画モード: OFF">
                <i class="fa-solid fa-pen-nib text-sm"></i>
            </button>

            <!-- 描画ツール群 -->
            <div class="toolbar-scroll min-w-0 w-full max-w-[150px] sm:max-w-[220px] overflow-x-auto overflow-y-visible flex items-center px-2 py-2 scrollbar-none">
                <div id="drawing-tools" class="flex items-center gap-1.5 shrink-0 opacity-40 transition-opacity">
                    <!-- 太さ -->
                    <div class="flex items-center gap-0.5 bg-slate-200/60 p-0.5 rounded-full shrink-0" aria-label="線の太さ">
                        <button type="button" class="size-btn toolbar-control w-4 h-4 rounded-full flex items-center justify-center transition-transform" data-size="small" title="細い">
                            <span class="w-1 h-1 rounded-full bg-slate-700"></span>
                        </button>
                        <button type="button" class="size-btn toolbar-control w-4 h-4 rounded-full flex items-center justify-center transition-transform" data-size="medium" title="普通">
                            <span class="w-2 h-2 rounded-full bg-slate-700"></span>
                        </button>
                        <button type="button" class="size-btn toolbar-control w-4 h-4 rounded-full flex items-center justify-center transition-transform" data-size="large" title="太い">
                            <span class="w-3 h-3 rounded-full bg-slate-700"></span>
                        </button>
                    </div>

                    <div class="h-3.5 w-px bg-slate-300 mx-0.5 shrink-0"></div>

                    <!-- 色 -->
                    <div class="flex items-center gap-1 shrink-0" aria-label="ペンの色">
                        <button type="button" class="color-btn toolbar-control w-4 h-4 rounded-full bg-red-500 border-2 border-white shadow-sm transition-transform ring-offset-1 shrink-0" data-color="#ef4444" title="赤ペン"></button>
                        <button type="button" class="color-btn toolbar-control w-4 h-4 rounded-full bg-blue-500 border-2 border-white shadow-sm transition-transform ring-offset-1 shrink-0" data-color="#3b82f6" title="青ペン"></button>
                        <button type="button" class="color-btn toolbar-control w-4 h-4 rounded-full bg-slate-900 border-2 border-white shadow-sm transition-transform ring-offset-1 shrink-0" data-color="#1e293b" title="黒ペン"></button>
                    </div>

                    <div class="h-3.5 w-px bg-slate-300 mx-0.5 shrink-0"></div>

                    <!-- その他 -->
                    <div class="flex items-center gap-1 shrink-0">
                        <button type="button" id="eraser-btn" class="toolbar-control w-5 h-5 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center text-[10px] transition-transform shrink-0" title="消しゴム">
                            <i class="fa-solid fa-eraser text-[10px]"></i>
                        </button>
                        <button type="button" id="undo-drawing-btn" class="toolbar-control w-5 h-5 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center text-[10px] transition-transform shrink-0" title="ひとつ戻る">
                            <i class="fa-solid fa-rotate-left text-[10px]"></i>
                        </button>
                        <button type="button" id="visibility-toggle-btn" class="toolbar-control w-5 h-5 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center text-[10px] shrink-0" title="描画を表示/非表示">
                            <i id="visibility-icon" class="fa-solid fa-eye text-[10px]"></i>
                        </button>
                        <button type="button" id="clear-canvas-btn" class="toolbar-control w-5 h-5 rounded-full bg-rose-100 hover:bg-rose-200 text-rose-600 flex items-center justify-center text-[10px] shrink-0" title="現在の描画を全消去">
                            <i class="fa-solid fa-trash-can text-[10px]"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- タイマー & 提出 -->
        <div class="justify-self-end min-w-0 flex items-center gap-1.5">
            <!-- タイマーボックスの幅を狭く調整 (w-[100px] -> w-auto px-2 py-1) -->
            <div id="timer-container" class="flex items-center justify-center gap-1 bg-amber-50 border border-amber-200 px-2 py-1 rounded-full text-amber-700 font-bold text-xs shadow-inner shrink-0">
                <i class="fa-regular fa-clock text-[11px]"></i>
                <span id="countdown-timer" class="tracking-tight">30:00</span>
            </div>

            <button id="submit-btn" class="self-center leading-tight box-border bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-3.5 rounded-full text-xs md:text-sm shadow-md transition-all active:scale-95 flex items-center gap-1.5 shrink-0">
                <span>提出</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
        </div>
    </header>

    <!-- メインビューポート -->
    <main class="flex-1 relative flex flex-col items-center justify-center overflow-hidden p-2 max-w-5xl mx-auto w-full">
        <!-- インジケータードット -->
        <div id="indicators" class="flex items-center gap-1.5 mb-1 shrink-0 z-30"></div>

        <!-- スライダー / グリッドコンテナ -->
        <div id="viewport-container" class="carousel-viewport w-full max-w-3xl flex-1 relative overflow-hidden rounded-2xl flex items-center justify-center my-auto">
            <!-- 横型3Dカルーセルスライダー -->
            <div id="cards-wrapper" class="card-carousel-horizontal absolute inset-0 items-center justify-start"></div>

            <!-- グリッド一覧表示ビュー（初期非表示） -->
            <div id="grid-wrapper" class="absolute inset-0 bg-slate-50/95 backdrop-blur-md p-4 pb-12 overflow-y-auto hidden z-30 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
        </div>

        <!-- 解答入力セクション -->
        <div id="answer-section" class="w-full max-w-md mt-1 mb-1 flex items-center justify-center shrink-0 z-30 px-2">
            <input type="text" id="answer-input" class="w-full bg-white border border-slate-200 rounded-full px-5 py-2 text-xs md:text-sm text-center shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all placeholder:text-slate-400" placeholder="○問題の解答を入力">
        </div>
    </main>

    <!-- 消しゴム表示用サークル -->
    <div id="eraser-cursor" class="eraser-cursor"></div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs md:text-sm px-4 py-2.5 rounded-full shadow-lg pointer-events-none transition-opacity duration-300 opacity-0 z-50 text-center max-w-xs"></div>

    <script>
        const puzzleData = [
            { id: 'A', title: '問題 A', src: 'image_2.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+A' },
            { id: 'B', title: '問題 B', src: 'image_3.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+B' },
            { id: 'C', title: '問題 C', src: 'image_4.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+C' },
            { id: 'D', title: '問題 D', src: 'image_5.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+D' },
            { id: 'E', title: '問題 E', src: 'image_6.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+E' },
            { id: 'F', title: '問題 F', src: 'image_7.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+F' },
            { id: 'G', title: '問題 G', src: 'image_8.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+G' },
            { id: 'H', title: '問題 H', src: 'image_9.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+H' },
            { id: 'I', title: '問題 I', src: 'image_10.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+I' },
            { id: 'J', title: '問題 J', src: 'image_11.png', fallback: 'https://placehold.co/600x450/f1f5f9/64748b?text=Problem+J' }
        ];

        let currentIndex = 0;
        let isGridView = false;
        let countdownSeconds = 30 * 60;
        let isTimeUp = false;
        let currentUser = { name: '', id: '' };

        const savedAnswers = {};
        const transformStates = {};

        // 描画関連の状態変数
        let isDrawMode = false;
        let currentTool = 'pen';
        let currentColor = '#ef4444'; // 100%不透明のカラー
        
        // 太さプリセット（ペン用・消しゴム用）
        const SIZE_PRESETS = {
            small: { pen: 2, eraser: 8 },
            medium: { pen: 4, eraser: 24 },
            large: { pen: 8, eraser: 48 }
        };
        let currentSizeKey = 'medium';

        const canvasContexts = {};
        const drawingHistory = {};
        const MAX_UNDO_STEPS = 30;
        const drawingStore = {};

        puzzleData.forEach(data => {
            savedAnswers[data.id] = '';
            transformStates[data.id] = { scale: 1, panX: 0, panY: 0 };
            drawingStore[data.id] = { visible: true };
            drawingHistory[data.id] = [];
        });

        let submissionCount = 0;
        const MAX_SUBMISSIONS = 2;
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/u/2/s/AKfycbyi6J6XeaJYv7D_H-0Lgv6q3J_1WxtJfeJWdFAlS9WVH_QbtWod6XZFPUws0gXljDdntQ/exec';

        const zoomResetHandlers = {};

        const loginModal = document.getElementById('login-modal');
        const confirmModal = document.getElementById('confirm-modal');
        const confirmAnswersList = document.getElementById('confirm-answers-list');
        const confirmRemainingCount = document.getElementById('confirm-remaining-count');
        const cancelSubmitBtn = document.getElementById('cancel-submit-btn');
        const finalSubmitBtn = document.getElementById('final-submit-btn');

        const startGalleryBtn = document.getElementById('start-gallery-btn');
        const inputUsername = document.getElementById('input-username');
        const inputUserid = document.getElementById('input-userid');
        const headerUserInfo = document.getElementById('header-user-info');
        const cardsWrapper = document.getElementById('cards-wrapper');
        const gridWrapper = document.getElementById('grid-wrapper');
        const indicators = document.getElementById('indicators');
        const viewToggleBtn = document.getElementById('view-toggle-btn');
        const toggleIcon = document.getElementById('toggle-icon');
        const toggleText = document.getElementById('toggle-text');
        const answerInput = document.getElementById('answer-input');
        const answerSection = document.getElementById('answer-section');
        const submitBtn = document.getElementById('submit-btn');
        const toast = document.getElementById('toast');

        // 描画コントロール用エレメント
        const drawModeToggleBtn = document.getElementById('draw-mode-toggle-btn');
        const drawingTools = document.getElementById('drawing-tools');
        const colorBtns = document.querySelectorAll('.color-btn');
        const sizeBtns = document.querySelectorAll('.size-btn');
        const eraserBtn = document.getElementById('eraser-btn');
        const undoDrawingBtn = document.getElementById('undo-drawing-btn');
        const timerContainer = document.getElementById('timer-container');
        const visibilityToggleBtn = document.getElementById('visibility-toggle-btn');
        const visibilityIcon = document.getElementById('visibility-icon');
        const clearCanvasBtn = document.getElementById('clear-canvas-btn');
        const eraserCursor = document.getElementById('eraser-cursor');

        let graceSeconds = 60;
        let submissionClosed = false;
        let fiveMinuteNoticeShown = false;
        let forcedConfirmationOpen = false;
        let submittedHistory = [];
        let isViewingSubmittedContent = false;

        function updateTimerDisplay(timerEl, seconds, grace = false) {
            const minutes = Math.floor(seconds / 60);
            const remainder = seconds % 60;
            timerEl.innerText = grace
                ? `猶予 ${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`
                : `${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`;
        }

        function startCountdown() {
            const timerEl = document.getElementById('countdown-timer');
            const timerInterval = setInterval(() => {
                if (!isTimeUp) {
                    if (countdownSeconds > 0) countdownSeconds--;
                    updateTimerDisplay(timerEl, countdownSeconds);

                    if (countdownSeconds <= 300 && countdownSeconds > 0) {
                        timerContainer.classList.remove('bg-amber-50', 'border-amber-200', 'text-amber-700');
                        timerContainer.classList.add('bg-red-50', 'border-red-300', 'text-red-700');
                        if (!fiveMinuteNoticeShown) {
                            fiveMinuteNoticeShown = true;
                            showToast('残り時間が5分になりました。');
                        }
                    }

                    if (countdownSeconds === 0) {
                        isTimeUp = true;
                        graceSeconds = 60;
                        timerContainer.classList.remove('bg-amber-50', 'border-amber-200', 'text-amber-700');
                        timerContainer.classList.add('bg-red-50', 'border-red-300', 'text-red-700');
                        updateTimerDisplay(timerEl, graceSeconds, true);
                        if (submissionCount < MAX_SUBMISSIONS) {
                            openSubmitConfirmation(true);
                            showToast('制限時間終了です。1分以内に提出してください。');
                        } else {
                            showToast('制限時間が終了しました。提出済みの解答を確認できます。');
                            updateSubmitButtonState();
                        }
                    }
                } else if (!submissionClosed) {
                    graceSeconds--;
                    updateTimerDisplay(timerEl, Math.max(0, graceSeconds), true);
                    if (graceSeconds <= 0) {
                        submissionClosed = true;
                        clearInterval(timerInterval);
                        timerEl.innerText = '00:00';
                        if (forcedConfirmationOpen) {
                            confirmModal.classList.add('hidden');
                            forcedConfirmationOpen = false;
                        }
                        updateSubmitButtonState();
                        showToast('提出猶予時間が終了しました。');
                    }
                }
            }, 1000);
        }

        function updateSubmitButtonState() {
            if (submissionCount >= MAX_SUBMISSIONS) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                submitBtn.innerHTML = '<span>提出内容を見る</span><i class="fa-solid fa-eye text-[10px]"></i>';
                return;
            }
            if (submissionClosed) {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                submitBtn.innerHTML = '<span>提出終了</span>';
                return;
            }
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            submitBtn.innerHTML = '<span>提出</span><i class="fa-solid fa-chevron-right text-[10px]"></i>';
        }

        function showToast(msg) {
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        startGalleryBtn.addEventListener('click', () => {
            const name = inputUsername.value.trim();
            const id = inputUserid.value.trim();
            if (!name || !id) {
                showToast('表示名とユーザーIDを入力してください。');
                return;
            }
            currentUser = { name, id };
            headerUserInfo.innerHTML = `<i class="fa-solid fa-user mr-1 text-indigo-500"></i>${currentUser.name} <span class="text-slate-400 font-normal">(${currentUser.id})</span>`;
            loginModal.classList.add('hidden');
            startCountdown();
        });

        // カルーセル用カード生成 (4:3の画像ボックス)
        puzzleData.forEach((data, idx) => {
            const dot = document.createElement('div');
            dot.className = `w-2 h-2 rounded-full transition-all cursor-pointer ${idx === 0 ? 'bg-indigo-600 w-4' : 'bg-slate-300'}`;
            dot.addEventListener('click', () => {
                if (isGridView) toggleView();
                currentIndex = idx;
                updateCarousel();
            });
            indicators.appendChild(dot);

            const card = document.createElement('div');
            card.className = `card-item-horizontal ${idx === 0 ? 'active-card' : ''}`;
            card.dataset.index = idx;
            card.innerHTML = `
                <div class="w-full max-w-2xl flex items-center justify-between mb-1 px-1 shrink-0 z-30">
                    <span class="text-xs text-slate-500 font-bold">${data.title}</span>
                </div>
                <div class="w-full max-w-2xl flex-1 rounded-2xl bg-white flex flex-col justify-between items-center border border-slate-100 p-2 overflow-hidden relative shadow-sm" id="card-inner-${data.id}">

                    <div class="w-full aspect-[4/3] relative flex items-center justify-center overflow-hidden image-wrapper-box my-auto" id="img-wrapper-${data.id}">
                        <div id="transform-target-${data.id}" class="relative w-full h-full flex items-center justify-center transition-transform duration-75 origin-center">
                            <img src="${data.src}" onerror="this.src='${data.fallback}'" class="max-w-full max-h-full object-contain select-none pointer-events-none" id="img-${data.id}" alt="${data.title}">
                            <canvas id="canvas-${data.id}" class="absolute inset-0 w-full h-full pointer-events-auto" style="touch-action: none;"></canvas>
                        </div>
                    </div>
                </div>
            `;

        function saveDrawingState(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            if (!canvas) return;
            const snapshot = document.createElement('canvas');
            snapshot.width = canvas.width;
            snapshot.height = canvas.height;
            snapshot.getContext('2d').drawImage(canvas, 0, 0);
            const history = drawingHistory[id] || (drawingHistory[id] = []);
            history.push(snapshot);
            if (history.length > MAX_UNDO_STEPS) history.shift();
        }

        function undoDrawing() {
            const currentId = puzzleData[currentIndex].id;
            const canvas = document.getElementById(`canvas-${currentId}`);
            const history = drawingHistory[currentId];
            if (!canvas || !history || history.length === 0) {
                showToast('これ以上戻せる操作はありません');
                return;
            }
            const previous = history.pop();
            const ctx = canvasContexts[currentId];
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (previous.width > 0 && previous.height > 0) {
                ctx.drawImage(previous, 0, 0, previous.width, previous.height,
                    0, 0, canvas.width, canvas.height);
            }
            ctx.restore();
            showToast('ひとつ前の描画に戻しました');
        }

        function updateEraserCursorSize() {
            const eraserSize = SIZE_PRESETS[currentSizeKey].eraser;
            eraserCursor.style.width = `${eraserSize}px`;
            eraserCursor.style.height = `${eraserSize}px`;
        }

        // キャンバスおよび描画設定
        function setupDrawingCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const ctx = canvas.getContext('2d');
            canvasContexts[id] = ctx;

            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;

            let canvasCssWidth = 0;
            let canvasCssHeight = 0;
            let canvasDpr = 1;
            ctx.__canvasDpr = 1;

            function resizeCanvas() {
                const width = canvas.clientWidth;
                const height = canvas.clientHeight;
                if (width <= 0 || height <= 0) return;

                const dpr = Math.max(1, window.devicePixelRatio || 1);
                const widthChanged = Math.abs(width - canvasCssWidth) > 0.5;
                const heightChanged = Math.abs(height - canvasCssHeight) > 0.5;
                const dprChanged = dpr !== canvasDpr;
                if (!widthChanged && !heightChanged && !dprChanged) return;

                const oldCanvas = document.createElement('canvas');
                oldCanvas.width = canvas.width;
                oldCanvas.height = canvas.height;
                if (oldCanvas.width > 0 && oldCanvas.height > 0) {
                    oldCanvas.getContext('2d').drawImage(canvas, 0, 0);
                }

                canvasCssWidth = width;
                canvasCssHeight = height;
                canvasDpr = dpr;
                ctx.__canvasDpr = dpr;
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);

                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                if (oldCanvas.width > 0 && oldCanvas.height > 0) {
                    ctx.drawImage(oldCanvas, 0, 0, oldCanvas.width, oldCanvas.height,
                        0, 0, width, height);
                }
            }
            const canvasResizeObserver = new ResizeObserver(resizeCanvas);
            canvasResizeObserver.observe(canvas);
            window.addEventListener('resize', resizeCanvas);
            requestAnimationFrame(resizeCanvas);

            function getCanvasCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
                const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);

                const visualWidth = rect.width || canvasCssWidth || 1;
                const visualHeight = rect.height || canvasCssHeight || 1;
                const x = (clientX - rect.left) * (canvasCssWidth / visualWidth);
                const y = (clientY - rect.top) * (canvasCssHeight / visualHeight);
                return { x, y };
            }

            canvas.addEventListener('pointerdown', (e) => {
                if (!isDrawMode) return;
                if (e.pointerType === 'touch' && !e.isPrimary) {
                    isDrawing = false;
                    eraserCursor.style.display = 'none';
                    return;
                }
                
                saveDrawingState(id);
                isDrawing = true;
                try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
                const coords = getCanvasCoordinates(e);
                lastX = coords.x;
                lastY = coords.y;

                if (currentTool === 'eraser') {
                    updateEraserCursorSize();
                    eraserCursor.style.display = 'block';
                    eraserCursor.style.left = `${e.clientX}px`;
                    eraserCursor.style.top = `${e.clientY}px`;
                    erasePixels(ctx, lastX, lastY);
                } else {
                    ctx.globalAlpha = 1;
                }
            });

            canvas.addEventListener('pointermove', (e) => {
                if (!isDrawMode) return;
                if (e.pointerType === 'touch' && !e.isPrimary) {
                    if (isDrawing) {
                        isDrawing = false;
                        eraserCursor.style.display = 'none';
                    }
                    return;
                }

                if (currentTool === 'eraser') {
                    eraserCursor.style.left = `${e.clientX}px`;
                    eraserCursor.style.top = `${e.clientY}px`;
                }

                if (!isDrawing) return;
                const coords = getCanvasCoordinates(e);

                if (currentTool === 'pen') {
                    ctx.save();
                    ctx.strokeStyle = currentColor;
                    ctx.globalAlpha = 1;
                    ctx.lineWidth = SIZE_PRESETS[currentSizeKey].pen;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(lastX, lastY);
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();
                    ctx.restore();
                } else if (currentTool === 'eraser') {
                    eraseAlongPath(ctx, lastX, lastY, coords.x, coords.y);
                }

                lastX = coords.x;
                lastY = coords.y;
            });

            const stopDrawing = () => {
                if (!isDrawing) return;
                isDrawing = false;
                eraserCursor.style.display = 'none';
            };

            canvas.addEventListener('pointerup', stopDrawing);
            canvas.addEventListener('pointercancel', stopDrawing);
            canvas.addEventListener('lostpointercapture', stopDrawing);
        }

        function erasePixels(ctx, x, y) {
            eraseAlongPath(ctx, x, y, x, y);
        }

        function eraseAlongPath(ctx, fromX, fromY, toX, toY) {
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.globalAlpha = 1;

            const rect = ctx.canvas.getBoundingClientRect();
            const baseWidth = ctx.canvas.clientWidth || rect.width || 1;
            const zoomScale = rect.width / baseWidth || 1;
            const brushDiameter = SIZE_PRESETS[currentSizeKey].eraser / zoomScale;

            ctx.beginPath();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = brushDiameter;
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();
            ctx.restore();
        }

        function updateVisibilityUI() {
            const currentId = puzzleData[currentIndex].id;
            const isVisible = drawingStore[currentId].visible;
            const canvas = document.getElementById(`canvas-${currentId}`);

                drawModeToggleBtn.title = '描画モード: OFF';

        function updateColorUI(selectedButton) {
            colorBtns.forEach(btn => btn.classList.remove('ring-2', 'ring-indigo-500', 'ring-offset-2', 'scale-110'));
            if (selectedButton) selectedButton.classList.add('ring-2', 'ring-indigo-500', 'ring-offset-2', 'scale-110');

        function updateSizeUI() {
            sizeBtns.forEach(btn => {
                const dot = btn.querySelector('span');

        // クリックイベントを親で一括処理
        drawingTools.addEventListener('click', (e) => {
            const button = e.target.closest('button');
            if (!button || !drawingTools.contains(button)) return;
            e.preventDefault();
            e.stopPropagation();

            if (button.matches('.size-btn')) {
                currentSizeKey = button.dataset.size;
                updateSizeUI();
                return;
            }

            if (button.matches('.color-btn')) {
                currentTool = 'pen';
                currentColor = button.dataset.color;
                updateColorUI(button);
                return;
            }

            if (button.id === 'eraser-btn') {
                currentTool = 'eraser';
                colorBtns.forEach(btn => btn.classList.remove('ring-2', 'ring-indigo-500', 'ring-offset-2', 'scale-110'));
                eraserBtn.classList.add('ring-2', 'ring-indigo-500', 'ring-offset-2', 'bg-indigo-100');
                updateEraserCursorSize();
                return;
            }

            if (button.id === 'undo-drawing-btn') {
                undoDrawing();
                return;
            }

            if (button.id === 'visibility-toggle-btn') {
                const currentId = puzzleData[currentIndex].id;
                drawingStore[currentId].visible = !drawingStore[currentId].visible;
                updateVisibilityUI();
                return;
            }

            if (button.id === 'clear-canvas-btn') {
                const currentId = puzzleData[currentIndex].id;
                const canvas = document.getElementById(`canvas-${currentId}`);
                const ctx = canvasContexts[currentId];
                if (!canvas || !ctx) {
                    showToast('描画キャンバスが見つかりませんでした');
                    return;
                }
                saveDrawingState(currentId);
                ctx.save();
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                ctx.restore();
                showToast('現在の問題の描画をすべて消去しました');
            }
        }, true);

        // 初期状態：赤ペン・普通の太さ
        if (colorBtns.length > 0) {
            currentColor = colorBtns[0].dataset.color;
            updateColorUI(colorBtns[0]);
        }
        updateSizeUI();

        function updateCarousel() {
            const viewportWidth = cardsWrapper.clientWidth || 600;
            cardsWrapper.style.transform = `translateX(${-currentIndex * viewportWidth}px)`;

            const cards = cardsWrapper.querySelectorAll('.card-item-horizontal');

        viewToggleBtn.addEventListener('click', toggleView);

        function toggleView() {

                cardsWrapper.classList.remove('hidden');

                timerContainer.classList.remove('absolute', 'left-1/2', '-translate-x-1/2');

            if (submitBtn) {

        function setupZoomAndPan(id) {
            const wrapper = document.getElementById(`img-wrapper-${id}`);
            const transformTarget = document.getElementById(`transform-target-${id}`);
            const resetBtn = document.getElementById(`reset-zoom-${id}`);

            let isPanning = false;
            let startPanX = 0;
            let startPanY = 0;

            function updateTransform() {
                const state = transformStates[id];
                transformTarget.style.transition = 'none';
                
                const maxPanX = Math.max(0, (wrapper.clientWidth * (state.scale - 1)) / 2);
                const maxPanY = Math.max(0, (wrapper.clientHeight * (state.scale - 1)) / 2);
                
                if (state.panX > maxPanX) state.panX = maxPanX;
                if (state.panX < -maxPanX) state.panX = -maxPanX;
                if (state.panY > maxPanY) state.panY = maxPanY;
                if (state.panY < -maxPanY) state.panY = -maxPanY;

                transformTarget.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale})`;
                
                if (state.scale > 1.02) {
                    resetBtn.classList.remove('hidden');
                } else {
                    resetBtn.classList.add('hidden');
                }
            }

            zoomResetHandlers[id] = function() {
                transformStates[id] = { scale: 1, panX: 0, panY: 0 };
                updateTransform();
            };

            wrapper.addEventListener('pointerdown', (e) => {
                const state = transformStates[id];
                if (state.scale > 1.02 && e.pointerType !== 'touch') {
                    isPanning = true;
                    try { wrapper.setPointerCapture(e.pointerId); } catch (_) {}
                    startPanX = e.clientX - state.panX;
                    startPanY = e.clientY - state.panY;
                }
            });

            wrapper.addEventListener('pointermove', (e) => {
                const state = transformStates[id];
                if (isPanning && state.scale > 1.02 && e.pointerType !== 'touch') {
                    state.panX = e.clientX - startPanX;
                    state.panY = e.clientY - startPanY;
                    updateTransform();
                }
            });

            wrapper.addEventListener('pointerup', () => { isPanning = false; });
            wrapper.addEventListener('pointercancel', () => { isPanning = false; });
            wrapper.addEventListener('lostpointercapture', () => { isPanning = false; });

            wrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                const state = transformStates[id];
                const zoomFactor = 1.15;
                if (e.deltaY < 0) {
                    state.scale = Math.min(state.scale * zoomFactor, 4.0);
                } else {
                    state.scale = Math.max(state.scale / zoomFactor, 1.0);
                    if (state.scale <= 1.0) {
                        state.panX = 0;
                        state.panY = 0;
                    }
                }
                updateTransform();
            }, { passive: false });

            let initialPinchDistance = null;
            let initialScale = 1;
            let initialTouchCenter = { x: 0, y: 0 };
            let initialPan = { x: 0, y: 0 };

            wrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    initialPinchDistance = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const state = transformStates[id];
                    initialScale = state.scale;
                    initialPan = { x: state.panX, y: state.panY };
                    initialTouchCenter = {
                        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                    };
                }
            }, { passive: true });

            wrapper.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && initialPinchDistance !== null) {
                    const currentDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const currentCenter = {
                        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                    };

                    const state = transformStates[id];
                    const scaleFactor = currentDist / initialPinchDistance;
                    state.scale = Math.min(Math.max(initialScale * scaleFactor, 1.0), 4.0);

                    const deltaX = currentCenter.x - initialTouchCenter.x;
                    const deltaY = currentCenter.y - initialTouchCenter.y;
                    state.panX = initialPan.x + deltaX;
                    state.panY = initialPan.y + deltaY;

                    if (state.scale <= 1.0) {
                        state.panX = 0;
                        state.panY = 0;
                    }

                    updateTransform();
                }
            }, { passive: true });

            wrapper.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    initialPinchDistance = null;
                }
            }, { passive: true });
        }

        window.resetZoomInstance = function(id) {
            if (zoomResetHandlers[id]) {
                zoomResetHandlers[id]();
            }
        };

        answerInput.addEventListener('input', (e) => {
            const currentId = puzzleData[currentIndex].id;
            const val = e.target.value;
            savedAnswers[currentId] = val;

            const gridBadge = document.getElementById(`grid-status-${currentId}`);
            if (gridBadge) {
                if (val && val.trim() !== '') {
                    gridBadge.className = 'inline-block text-[10px] px-2.5 py-0.5 rounded-full border text-indigo-600 bg-indigo-50 border-indigo-100 font-semibold truncate max-w-full';
                    gridBadge.innerText = val;
                } else {
                    gridBadge.className = 'inline-block text-[10px] px-2.5 py-0.5 rounded-full border text-slate-400 bg-slate-100 border-slate-200 truncate max-w-full';
                    gridBadge.innerText = '未解答';
                }
            }
        });

        let touchStartX = 0;
        let touchEndX = 0;

        cardsWrapper.addEventListener('touchstart', (e) => {
            if (isDrawMode) return;
            if (e.touches.length > 1) return;

            const currentId = puzzleData[currentIndex].id;
            const currentScale = transformStates[currentId]?.scale || 1;

            if (currentScale <= 1.05) {
                touchStartX = e.changedTouches[0].clientX;
            } else {
                touchStartX = 0;
            }
        }, { passive: true });

        cardsWrapper.addEventListener('touchend', (e) => {
            if (isDrawMode) return;
            if (e.changedTouches.length > 1) return;

            const currentId = puzzleData[currentIndex].id;
            const currentScale = transformStates[currentId]?.scale || 1;

            if (currentScale <= 1.05 && touchStartX !== 0) {
                touchEndX = e.changedTouches[0].clientX;
                if (touchEndX < touchStartX - 40) {
                    if (currentIndex < puzzleData.length - 1) {
                        currentIndex++;
                    } else {
                        currentIndex = 0;
                    }
                    updateCarousel();
                }
                if (touchEndX > touchStartX + 40) {
                    if (currentIndex > 0) {
                        currentIndex--;
                    } else {
                        currentIndex = puzzleData.length - 1;
                    }
                    updateCarousel();
                }
            }
        }, { passive: true });

        function renderAnswerList(target, answers, includeQuestionTitle = true) {
            target.innerHTML = '';
            puzzleData.forEach(p => {
                const raw = answers && answers[p.id] !== undefined ? String(answers[p.id]) : '';
                const ans = raw.trim();
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between gap-3 bg-slate-50 border border-slate-100 p-2.5 rounded-xl';
                const title = document.createElement('span');
                title.className = 'font-bold text-slate-700 shrink-0';
                title.textContent = p.title;
                const answer = document.createElement('span');
                answer.className = `font-semibold text-right break-all ${ans ? 'text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100' : 'text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full'}`;
                answer.textContent = ans || '未回答';
                item.append(title, answer);
                target.appendChild(item);
            });
        }

        function openSubmitConfirmation(forced = false) {
            if (submissionClosed) {
                showToast('提出猶予時間が終了しました。');
                return;
            }
            if (submissionCount >= MAX_SUBMISSIONS) {
                openSubmittedContent();
                return;
            }

            isViewingSubmittedContent = false;
            forcedConfirmationOpen = forced;
            document.getElementById('confirm-title').innerHTML =
                '<i class="fa-solid fa-clipboard-check text-indigo-600"></i> 解答内容の最終確認';
            document.getElementById('confirm-description').textContent =
                '以下の内容で提出します。よろしいですか？';
            confirmRemainingCount.textContent = `残り提出可能回数: ${MAX_SUBMISSIONS - submissionCount} 回`;
            confirmRemainingCount.classList.remove('hidden');
            renderAnswerList(confirmAnswersList, savedAnswers);

            cancelSubmitBtn.textContent = '修正に戻る';
            cancelSubmitBtn.classList.toggle('hidden', forced);
            finalSubmitBtn.classList.remove('hidden');
            finalSubmitBtn.disabled = false;
            finalSubmitBtn.innerHTML = '<span>確定して提出</span><i class="fa-solid fa-paper-plane text-[10px]"></i>';
            confirmModal.classList.remove('hidden');
        }

        function openSubmittedContent() {
            isViewingSubmittedContent = true;
            forcedConfirmationOpen = false;
            document.getElementById('confirm-title').innerHTML =
                '<i class="fa-solid fa-eye text-indigo-600"></i> 提出済みの解答';
            document.getElementById('confirm-description').textContent =
                'これまでに提出した解答内容です。';
            confirmRemainingCount.classList.add('hidden');
            confirmAnswersList.innerHTML = '';

            submittedHistory.forEach((submission, index) => {
                const section = document.createElement('section');
                section.className = 'space-y-2 mb-4';
                const heading = document.createElement('h4');
                heading.className = 'font-bold text-slate-700 text-xs px-1';
                heading.textContent = `${index + 1}回目の提出`;
                section.appendChild(heading);
                const list = document.createElement('div');
                list.className = 'space-y-2';
                renderAnswerList(list, submission.answers);
                section.appendChild(list);
                confirmAnswersList.appendChild(section);
            });

            cancelSubmitBtn.classList.remove('hidden');
            cancelSubmitBtn.textContent = '閉じる';
            finalSubmitBtn.classList.add('hidden');
            confirmModal.classList.remove('hidden');
        }

        submitBtn.addEventListener('click', () => {
            if (submissionCount >= MAX_SUBMISSIONS) {
                openSubmittedContent();
                return;
            }
            if (submissionClosed) {
                showToast('提出猶予時間が終了しました。');
                return;
            }
            openSubmitConfirmation(isTimeUp);
        });

        cancelSubmitBtn.addEventListener('click', () => {
            confirmModal.classList.add('hidden');
            if (isViewingSubmittedContent) {
                cancelSubmitBtn.textContent = '修正に戻る';
                isViewingSubmittedContent = false;
            }
            forcedConfirmationOpen = false;
        });

        finalSubmitBtn.addEventListener('click', async () => {
            if (submissionClosed) {
                showToast('提出猶予時間が終了しました。');
                return;
            }
            if (submissionCount >= MAX_SUBMISSIONS) {
                openSubmittedContent();
                return;
            }

            finalSubmitBtn.disabled = true;
            submissionCount++;
            const submittedAnswers = { ...savedAnswers };
            submittedHistory.push({
                submissionCount,
                answers: submittedAnswers,
                timestamp: new Date().toLocaleString('ja-JP')
            });

            const submissionData = {
                timestamp: new Date().toLocaleString('ja-JP'),
                name: currentUser.name,
                id: currentUser.id,
                submissionCount: submissionCount,
                answers: submittedAnswers
            };

            showToast(`(${submissionCount}/${MAX_SUBMISSIONS}) 解答を送信中...`);

            try {
                if (GAS_WEB_APP_URL && GAS_WEB_APP_URL !== 'Https://script.google.com/macros/s/AKfycbyi6J6XeaJYv7D_H-0Lgv6q3J_1WxtJfeJWdFAlS9WVH_QbtWod6XZFPUws0gXljDdntQ/exec') {
                    await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(submissionData)
                    });
                } else {
                    console.log('提出データ送信 (ダミー):', submissionData);
                }

                showToast(`${currentUser.name} さん (${submissionCount}回目) の解答を提出しました！`);
            } catch (err) {
                console.error(err);
                showToast('スプレッドシートへの送信に失敗しました。');
            } finally {
                confirmModal.classList.add('hidden');
                finalSubmitBtn.disabled = false;
                forcedConfirmationOpen = false;
                updateSubmitButtonState();
                if (isViewingSubmittedContent) isViewingSubmittedContent = false;
                cancelSubmitBtn.textContent = '修正に戻る';
            }
        });

        updateSubmitButtonState();
        updateCarousel();
    </script>
</body>
</html>
